<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artesano Games — Tiny Game Studio</title>
    <meta name="description" content="Crafting One Game a Month">
    <meta name="keywords" content="indie games, game studio, artesano games, video games">
    <meta name="author" content="Artesano Games">

    <meta property="og:title" content="Artesano Games — One Game a Month">
    <meta property="og:description" content="Crafting One Game a Month">
    <meta property="og:image" content="./images/og-image.jpg">
    <meta property="og:url" content="https://artesanogames.com">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Artesano Games">
    <meta name="twitter:description" content="Crafting One Game a Month">
    <meta name="twitter:image" content="./images/twitter-card.jpg">

    <link rel="icon" href="images/logo.jpg" type="image/jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/core/variables.css?v=3">
    <link rel="stylesheet" href="./css/core/reset.css?v=3">
    <link rel="stylesheet" href="./css/desktop/shell.css?v=3">
    <link rel="stylesheet" href="./css/desktop/window.css?v=3">
    <link rel="stylesheet" href="./css/desktop/taskbar.css?v=3">
    <link rel="stylesheet" href="./css/apps/outnt.css?v=3">
    <link rel="stylesheet" href="./css/apps/about.css?v=3">
    <link rel="stylesheet" href="./css/apps/support.css?v=3">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Artesano Games",
        "url": "https://artesanogames.com",
        "logo": "./images/logo.png",
        "description": "Crafting One Game a Month",
        "sameAs": [
            "https://twitter.com/artesanogames"
        ]
    }
    </script>
</head>
<body>
    <!-- Desktop Shell -->
    <div class="desktop-shell" role="application" aria-label="Artesano Games Desktop">
        <div class="desktop-area">
            <div class="desktop-icons-grid" role="list" aria-label="Desktop icons">
                <!-- Icons injected by JS -->
            </div>
        </div>

        <!-- Taskbar -->
        <nav class="taskbar" role="navigation" aria-label="Taskbar">
            <div class="taskbar-start">
                <span class="taskbar-logo">Artesano Games</span>
            </div>
            <div class="taskbar-center">
                <!-- Open app items injected by JS -->
            </div>
            <div class="taskbar-end">
                <button class="theme-toggle-btn" aria-label="Toggle theme">🌙</button>
                <time class="taskbar-clock" aria-label="Current time">00:00</time>
            </div>
        </nav>
    </div>

    <!-- Mobile Fallback -->
    <div class="mobile-fallback">
        <header style="text-align: center; padding: 40px 20px;">
            <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 16px;">Artesano Games</h1>
            <p style="color: var(--text-muted); max-width: 400px; margin: 0 auto;">
                Our desktop experience is best viewed on a larger screen.
                Meanwhile, here is a preview of our work.
            </p>
        </header>
        <main style="padding: 20px;">
            <div style="display: grid; gap: 20px; max-width: 400px; margin: 0 auto;">
                <div style="background: var(--bg-window); border-radius: var(--radius-lg); padding: 20px; border: 1px solid var(--border-light);">
                    <div style="font-size: 2rem; margin-bottom: 12px;">🖥️</div>
                    <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 8px;">Outn't</h2>
                    <p style="color: var(--text-muted); font-size: 0.875rem;">A 3D puzzle shot game about escaping an infinite office loop.</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
